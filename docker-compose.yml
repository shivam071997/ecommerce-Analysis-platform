services:

  backend:
    build:
      context: ./backend
    container_name: ecommerce-backend
    ports:
      - "5000:5000"
    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
